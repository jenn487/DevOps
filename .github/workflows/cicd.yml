name: CI/CD PracticaFinal

on:
  push:
    branches: ["PracticaFinal"]

concurrency:
  group: practicafinal-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: practicafinal
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/practicafinal
  PY_VERSION: "3.12"

jobs:
  test:
    name: Install & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PY_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests
        run: pytest -q

  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (latest + sha)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_TAG }}

  deploy_to_render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Trigger Render Deploy
        run: |
        set -e
        STATUS_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
          -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{}')
        echo "Render API status: $STATUS_CODE"
        cat /tmp/resp.json
        if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
          echo "❌ Render deploy failed"
          exit 1
        fi


        