name: CI/CD Pipeline

on:
  push:
    branches: [ "PracticaFinal" ]  

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

  
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/practicafinal:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/practicafinal:latest

      - name: Desplegar en Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
